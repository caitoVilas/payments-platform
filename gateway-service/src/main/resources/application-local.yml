server:
  port: 9000
  servlet:
    context-path: /gateway
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: client-service
              uri: lb://client/api
              predicates:
                - Path=/client/api/**
              filters:
                - StripPrefix=0
            - id: merchant-service
              uri: lb://merchant/api
              predicates:
                - Path=/merchant/api/**
              filters:
                - StripPrefix=0
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true